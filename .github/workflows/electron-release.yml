name: Desktop Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      version_changed: ${{ steps.version.outputs.version_changed }}

    steps:
      - name: Resolve version metadata
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = "package.json";

            async function readVersion(ref) {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref,
              });

              if (Array.isArray(data) || !data.content) {
                throw new Error(`Unable to read ${path} at ${ref}`);
              }

              const raw = Buffer.from(data.content, data.encoding).toString("utf8");
              const parsed = JSON.parse(raw);
              if (!parsed.version || typeof parsed.version !== "string") {
                throw new Error(`Missing version field in ${path} at ${ref}`);
              }

              return parsed.version.trim();
            }

            const currentVersion = await readVersion(context.sha);
            const tag = `v${currentVersion}`;
            const beforeSha = context.payload.before;

            let previousVersion = null;
            let versionChanged = true;

            if (context.eventName === "push" && beforeSha && !/^0+$/.test(beforeSha)) {
              try {
                previousVersion = await readVersion(beforeSha);
                versionChanged = previousVersion !== currentVersion;
              } catch (error) {
                core.info(`Could not read previous version from ${beforeSha}: ${error.message}`);
                versionChanged = true;
              }
            }

            core.info(`Current version: ${currentVersion}`);
            core.info(`Previous version: ${previousVersion ?? "not-found"}`);
            core.info(`Version changed: ${versionChanged}`);

            core.setOutput("version", currentVersion);
            core.setOutput("tag", tag);
            core.setOutput("version_changed", versionChanged ? "true" : "false");

  release-windows:
    needs: detect-version
    if: github.event_name == 'workflow_dispatch' || needs.detect-version.outputs.version_changed == 'true'
    runs-on: windows-latest
    environment:
      name: release-env
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Must run before setup-node so its `cache: pnpm` can find the store.
      # Version comes from the packageManager field in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 — it imports node:sqlite, which does
          # not exist on Node 20, so the whole install crashes there. Keep this
          # in sync with the engines field in package.json.
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      # The native addon is built by dist:win itself, so there is no separate
      # step here — running it twice just recompiles against Electron's ABI for
      # nothing.

      - name: Create .env from GitHub Secrets
        env:
          CT_BACKEND_URL: ${{ secrets.CT_BACKEND_URL }}
          # A DSN is a public write-only key; it has to be in the packaged env
          # or the shipped app reports no crashes at all. Optional so a fork
          # without the secret can still build.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CT_BACKEND_URL)) {
            throw "Missing secret: CT_BACKEND_URL"
          }

          $lines = @("CT_BACKEND_URL=$($env:CT_BACKEND_URL)")
          if (-not [string]::IsNullOrWhiteSpace($env:SENTRY_DSN)) {
            $lines += "SENTRY_DSN=$($env:SENTRY_DSN)"
          } else {
            Write-Host "SENTRY_DSN not set: this build will report no crashes."
          }
          $lines | Set-Content -Path .env -Encoding UTF8

      - name: Build desktop release artifacts
        env:
          # Without this @sentry/vite-plugin silently skips the source-map
          # upload, so every stack trace would be unreadable minified output.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm dist:win

      - name: Validate update artifacts and feed metadata
        run: |
          $version = "${{ needs.detect-version.outputs.version }}"
          $expectedExe = "Connect-Setup-$version.exe"
          $exePath = Join-Path "release" $expectedExe
          $blockmapPath = "$exePath.blockmap"
          $latestYmlPath = Join-Path "release" "latest.yml"

          if (-not (Test-Path $exePath)) {
            throw "Missing expected installer artifact: $exePath"
          }

          if (-not (Test-Path $blockmapPath)) {
            throw "Missing expected blockmap artifact: $blockmapPath"
          }

          if (-not (Test-Path $latestYmlPath)) {
            throw "Missing latest.yml metadata file"
          }

          $latestRaw = Get-Content -Path $latestYmlPath -Raw
          if ($latestRaw -notmatch [Regex]::Escape($expectedExe)) {
            throw "latest.yml does not reference expected installer: $expectedExe"
          }

          Write-Host "Artifact validation passed for version $version"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/Connect-Setup-*.exe
            release/Connect-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  publish-release:
    needs: [detect-version, release-windows]
    if: github.event_name == 'workflow_dispatch' || needs.detect-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.detect-version.outputs.tag }}
          name: Connect Together Desktop v${{ needs.detect-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          draft: false
          prerelease: false
          files: |
            release/Connect-Setup-*.exe
            release/Connect-Setup-*.exe.blockmap
            release/latest.yml

