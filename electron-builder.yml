appId: com.nightdevx.connect-desktop
productName: Connect
# Shown as the exe's copyright. The company name and the publisher in
# Windows' installed-apps list come from package.json's author.
copyright: Copyright © 2026 nightdijital
icon: build/icon.ico
compression: normal
electronLanguages:
  - en-US
  - tr
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - public/images/logo.ico
  - public/images/logo.png
  - package.json
  - native/audio-loopback/index.js
  - native/audio-loopback/package.json
  - native/audio-loopback/build/Release/*.node
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.d.cts"
  - "!**/*.d.mts"
  - "!**/tsconfig*.json"
  - "!**/__tests__/**"
  - "!**/test/**"
  - "!**/tests/**"
  # Build-time only. @sentry/node 11 lists @sentry/bundler-plugins (its vite/
  # rollup/webpack subpaths) as a dependency, and with it the Sentry CLI (15 MB),
  # oxc-parser with its native binding, magic-string and glob. The runtime entry
  # never loads any of them: 21 MB of the 53 MB archive. check-packaged-deps.cjs
  # knows the one excluded root and still fails if anything else goes missing.
  - "!node_modules/@sentry/bundler-plugins/**"
  - "!node_modules/sentry/**"
  - "!node_modules/oxc-parser/**"
  - "!node_modules/@oxc-parser/**"
  - "!node_modules/@oxc-project/**"
  - "!node_modules/magic-string/**"
  - "!node_modules/@jridgewell/sourcemap-codec/**"
  - "!node_modules/glob/**"
  - "!node_modules/path-scurry/**"
  - "!node_modules/minipass/**"
  - "!node_modules/lru-cache/**"
  - "!node_modules/minimatch/**"
  - "!node_modules/brace-expansion/**"
  - "!node_modules/balanced-match/**"
  # Main reads one hls.js build, dist/hls.min.js (watch-player-host.ts); the
  # other builds and the sources were 9 MB of the archive.
  - "!node_modules/hls.js/src/**"
  - "!node_modules/hls.js/dist/!(hls.min.js)"
  # zod's TypeScript sources, and the v3 API nothing here imports.
  - "!node_modules/zod/src/**"
  - "!node_modules/zod/v3/**"
asar: true
# Switches baked into the shipped Electron binary. With them, the installed
# exe cannot be turned into a plain Node.js runtime (ELECTRON_RUN_AS_NODE,
# NODE_OPTIONS, --inspect) by anyone who can set an environment variable or
# write a shortcut, and it only runs the app from app.asar, whose contents are
# checked against the hash built into the exe. grantFileProtocolExtraPrivileges
# keeps its default: the page is still loaded from file://.
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
# Native .node must live outside the asar archive to be loadable at runtime.
asarUnpack:
  - native/**
extraResources:
  - from: .env.runtime
    to: .env.runtime
publish:
  provider: github
  owner: nightdevx
  repo: connect-desktop
  releaseType: release
# Mandatory updates. Every build older than minimumVersion is locked until it
# installs the newest release (src/main/update/modular-updater.ts); electron-
# builder copies this into latest.yml. To ship a release as mandatory, set this
# to that release's version in the version-bump commit; leave it as it is for
# an optional one. Quoted, because YAML reads an unquoted 1.0 as a number. Never
# above package.json's version: that build would lock itself, and
# scripts/check-release-notes.cjs refuses it.
releaseInfo:
  vendor:
    minimumVersion: "0.3.0"
win:
  icon: build/icon.ico
  artifactName: Connect-Setup-${version}.${ext}
  target:
    - nsis
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
linux:
  icon: build/icons
  target:
    - AppImage
    - deb

deb:
  maintainer: nightdijital <iletisim@nightdijital.com>



