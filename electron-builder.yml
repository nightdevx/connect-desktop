appId: com.nightdevx.connect-desktop
productName: Connect
icon: build/icon.ico
compression: normal
electronLanguages:
  - en-US
  - tr
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - public/images/logo.ico
  - public/images/logo.png
  - package.json
  - native/audio-loopback/index.js
  - native/audio-loopback/package.json
  - native/audio-loopback/build/Release/*.node
  # tsc compiles the renderer too (it has to, that is how it gets typechecked)
  # and writes 115 CommonJS files into dist/renderer/src that nothing ever
  # loads — index.html points at the Vite bundle in dist/renderer/assets.
  # `pnpm build` happens to wipe them because Vite empties its outDir after
  # tsc runs, but any packaging that skips a full clean build shipped them.
  - "!dist/renderer/src"
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.d.cts"
  - "!**/*.d.mts"
  - "!**/tsconfig*.json"
  - "!**/__tests__/**"
  - "!**/test/**"
  - "!**/tests/**"
  # Build-time only. @sentry/node 11 lists @sentry/bundler-plugins (its vite/
  # rollup/webpack subpaths) as a dependency, and with it the Sentry CLI (15 MB),
  # oxc-parser with its native binding, magic-string and glob. The runtime entry
  # never loads any of them: 21 MB of the 53 MB archive. check-packaged-deps.cjs
  # knows the one excluded root and still fails if anything else goes missing.
  - "!node_modules/@sentry/bundler-plugins/**"
  - "!node_modules/sentry/**"
  - "!node_modules/oxc-parser/**"
  - "!node_modules/@oxc-parser/**"
  - "!node_modules/@oxc-project/**"
  - "!node_modules/magic-string/**"
  - "!node_modules/@jridgewell/sourcemap-codec/**"
  - "!node_modules/glob/**"
  - "!node_modules/path-scurry/**"
  - "!node_modules/minipass/**"
  - "!node_modules/lru-cache/**"
  - "!node_modules/minimatch/**"
  - "!node_modules/brace-expansion/**"
  - "!node_modules/balanced-match/**"
asar: true
# Native .node must live outside the asar archive to be loadable at runtime.
asarUnpack:
  - native/**
extraResources:
  - from: .env.runtime
    to: .env.runtime
publish:
  provider: github
  owner: nightdevx
  repo: connect-desktop
  releaseType: release
# Mandatory updates. Every build older than minimumVersion is locked until it
# installs the newest release (src/main/update/modular-updater.ts); electron-
# builder copies this into latest.yml. To ship a release as mandatory, set this
# to that release's version in the version-bump commit; leave it as it is for
# an optional one. Quoted, because YAML reads an unquoted 1.0 as a number. Never
# above package.json's version: that build would lock itself, and
# scripts/check-release-notes.cjs refuses it.
releaseInfo:
  vendor:
    minimumVersion: "0.2.9"
win:
  icon: build/icon.ico
  artifactName: Connect-Setup-${version}.${ext}
  target:
    - nsis
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
linux:
  icon: build/icons
  target:
    - AppImage
    - deb

deb:
  maintainer: nightdevx <nightdevx@github.com>



