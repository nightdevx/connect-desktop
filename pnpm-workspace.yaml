# electron-builder cannot walk pnpm's isolated store: peer-suffixed directories
# like debug@4.4.3_supports-color@8.1.1 resolve, but their own dependencies get
# dropped from the asar. That shipped 0.1.28 with debug/src/common.js present and
# ms missing, so the app died on launch with "Cannot find module 'ms'".
# A flat node_modules is the layout electron-builder actually supports.
nodeLinker: hoisted

allowBuilds:
  "@sentry/cli": true
  "electron-winstaller": true
  "electron": true
  "sharp": true
