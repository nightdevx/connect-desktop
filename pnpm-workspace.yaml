# electron-builder's pnpm module collector shipped 0.1.28 with debug/src/common.js
# packed and the ms it requires missing, so the app died on launch with
# "Cannot find module 'ms'". 26.15.3 fixes the collector; a flat node_modules is
# the layout it handles best either way. Keep both -- scripts/check-packaged-deps.cjs
# is what actually proves the archive is complete.
nodeLinker: hoisted

allowBuilds:
  "@sentry/cli": true
  "electron-winstaller": true
  "electron": true
  "sharp": true
